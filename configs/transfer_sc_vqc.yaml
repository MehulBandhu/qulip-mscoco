model_type: "vqc"
seed: 42

batch_size: 256
qlr: 0.001
clr: 0.00001
embedding_qubits: 9

epochs: 100
lr_patience: 100000

dataset:
  name: "transfer-sc-vqc"
  class: "modules.data_pipeline.datasets.CocoDataset"
  collate_fn: "modules.data_pipeline.datasets.coco_collate_fn"
  eval_mapper: "modules.models.fusion.engine.mscoco_mapper"
  train:
    text_path: "data/mscoco/processed/train_5k.pkl"
    img_path: "data/mscoco/processed/image_embeddings.pt"
  val:
    text_path: "data/mscoco/processed/val_1k.pkl"
    img_path: "data/mscoco/processed/image_embeddings.pt"
    diagnostics: ["global_retrieval"]
  test:
    swap_object:
      class: "modules.data_pipeline.datasets.SugarCrepePPDataset"
      collate_fn: "modules.data_pipeline.datasets.sugarcrepe_collate_fn"
      text_path: "data/sugarcrepe/processed/swap_object.pkl"
      img_path: "data/mscoco/processed/image_embeddings.pt"
      task: "evaluate_sugarcrepe_pp"
    swap_atribute:
      class: "modules.data_pipeline.datasets.SugarCrepePPDataset"
      collate_fn: "modules.data_pipeline.datasets.sugarcrepe_collate_fn"
      text_path: "data/sugarcrepe/processed/swap_atribute.pkl"
      img_path: "data/mscoco/processed/image_embeddings.pt"
      task: "evaluate_sugarcrepe_pp"
    replace_object:
      class: "modules.data_pipeline.datasets.SugarCrepePPDataset"
      collate_fn: "modules.data_pipeline.datasets.sugarcrepe_collate_fn"
      text_path: "data/sugarcrepe/processed/replace_object.pkl"
      img_path: "data/mscoco/processed/image_embeddings.pt"
      task: "evaluate_sugarcrepe_pp"
    replace_attribute:
      class: "modules.data_pipeline.datasets.SugarCrepePPDataset"
      collate_fn: "modules.data_pipeline.datasets.sugarcrepe_collate_fn"
      text_path: "data/sugarcrepe/processed/replace_attribute.pkl"
      img_path: "data/mscoco/processed/image_embeddings.pt"
      task: "evaluate_sugarcrepe_pp"
    replace_relation:
      class: "modules.data_pipeline.datasets.SugarCrepePPDataset"
      collate_fn: "modules.data_pipeline.datasets.sugarcrepe_collate_fn"
      text_path: "data/sugarcrepe/processed/replace_relation.pkl"
      img_path: "data/mscoco/processed/image_embeddings.pt"
      task: "evaluate_sugarcrepe_pp"
text:
  ansatz: "custom_v5"
  n: 1
  s: 1
  p: 1
  layers: 2
  curry: false
  spider: false

vision:
  layers: 4
  method: 'mlp'
